<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
    <style>
        :root {
          --bg:#14181d;
          --panel:#20262d;
          --panel-strong:#232a31;
          --text:#eef2f6;
          --muted:#8ea0b5;
          --accent:#56b6a7;
          --line:#2e3741;
        }
        html, body { background: var(--bg); color: var(--text); margin:0; padding:0; }
        body { font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text", "Helvetica Neue", Arial, "JetBrains Mono", monospace; }
        #wrap { padding: 16px 18px; }
        .message { margin-bottom: 10px; }
        .message-body { min-width: 0; }
        .thinking-indicator {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          min-height: 26px;
          color: #d8e0e8;
          background: linear-gradient(180deg, rgba(32,38,45,0.95), rgba(26,30,35,0.95));
          border: 1px solid var(--line);
          border-radius: 999px;
          padding: 8px 12px;
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .thinking-label {
          font-size: 13px;
          font-weight: 600;
          letter-spacing: 0.01em;
        }
        .thinking-dots {
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }
        .thinking-dots span {
          width: 7px;
          height: 7px;
          border-radius: 999px;
          background: var(--accent);
          opacity: 0.28;
          animation: thinkingPulse 1.15s ease-in-out infinite;
        }
        .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes thinkingPulse {
          0%, 80%, 100% {
            opacity: 0.28;
            transform: translateY(0) scale(0.9);
          }
          40% {
            opacity: 1;
            transform: translateY(-1px) scale(1);
          }
        }
        h1,h2,h3{ color: var(--accent); margin: 14px 0 8px; }
        pre {
          background: var(--panel);
          border: 1px solid var(--line);
          padding: 12px;
          border-radius: 12px;
          overflow:auto;
          position: relative;
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
        }
        code { background: var(--panel-strong); padding: 2px 5px; border-radius: 6px; }
        .role { color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
        hr { border:0; height:1px; background:var(--line); margin:16px 0; }
        details {
          background: var(--panel);
          border: 1px solid var(--line);
          border-radius: 12px;
          padding: 10px 12px 12px;
        }
        summary {
          color: #d8e0e8;
          font-weight: 600;
          margin-bottom: 10px;
        }

        /* Copy button: always visible, neutral -> hover fill -> green on copied */
        .copy-btn {
          position: absolute;
          top: 6px; right: 6px;
          border: 1px solid #3a4651;
          background: rgba(20,24,29,0.85);
          color: #d6dee7;
          border-radius: 9px;
          font-size: 12px;
          padding: 4px 9px;
          cursor: pointer;
          user-select: none;
          transition: background-color .12s ease, color .12s ease, border-color .12s ease, transform .05s ease;
          backdrop-filter: blur(2px);
        }
        .copy-btn:hover {
          background: #232a31;
          border-color: #4d5c6a;
          color: #ffffff;
        }
        .copy-btn:active { transform: translateY(1px); }
        .copy-btn.copied {
          background: #2f8f81;
          border-color: #2f8f81;
          color: #f8fffd;
        }
    </style>
    <script>
        function parseBlocks(html) {
          const temp = document.createElement('div');
          temp.innerHTML = html;
          return Array.from(temp.children);
        }

        // Sticky scrolling
        function nearBottom(thresholdPx = 80) {
          return (window.innerHeight + window.pageYOffset) >= (document.body.scrollHeight - thresholdPx);
        }
        function scrollToBottom() { window.scrollTo({ top: document.body.scrollHeight }); }

        // Add stable copy buttons to all <pre><code> blocks inside root
        function addCopyButtons(root) {
          root.querySelectorAll('pre').forEach(pre => {
            // Skip if a button already exists
            if (pre.querySelector('.copy-btn')) return;
            const codeEl = pre.querySelector('code');
            if (!codeEl) return;

            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = 'Copy';
            btn.onclick = async (e) => {
              e.stopPropagation();
              const text = codeEl.innerText;
              try {
                if (navigator.clipboard && window.isSecureContext) {
                  await navigator.clipboard.writeText(text);
                } else {
                  const ta = document.createElement('textarea');
                  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                  document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                }
                btn.classList.add('copied');
                btn.textContent = 'Copied';
              } catch (_) { /* no-op */ }
            };
            pre.addEventListener('mouseleave', () => {
              btn.classList.remove('copied');
              btn.textContent = 'Copy';
            });
            pre.appendChild(btn);
          });
        }

        // Highlight only new/unhighlighted code blocks
        function highlightNew(root) {
          root.querySelectorAll('pre > code').forEach(codeEl => {
            const pre = codeEl.parentElement;
            if (!codeEl.classList.contains('hljs')) {
              try { hljs.highlightElement(codeEl); } catch(e) {}
            }
            // ensure copy buttons exist
            if (!pre.querySelector('.copy-btn')) {
              addCopyButtons(pre);
            }
          });
        }

        function setHtml(html) {
          const wasNearBottom = nearBottom();
          const wrap = document.getElementById('wrap');
          wrap.innerHTML = html;
          highlightNew(wrap);
          addCopyButtons(wrap);
          if (wasNearBottom) scrollToBottom();
        }

        function appendBlock(blockHtml) {
          const wasNearBottom = nearBottom();
          const wrap = document.getElementById('wrap');
          const blocks = parseBlocks(blockHtml);
          blocks.forEach(block => wrap.appendChild(block));
          highlightNew(wrap);
          addCopyButtons(wrap);
          if (wasNearBottom) scrollToBottom();
        }

        function replaceLastBlock(blockHtml) {
          const wasNearBottom = nearBottom();
          const wrap = document.getElementById('wrap');
          const blocks = parseBlocks(blockHtml);
          if (blocks.length === 0) return;
          const block = blocks[0];
          if (!wrap.lastElementChild) {
            wrap.appendChild(block);
          } else {
            wrap.lastElementChild.replaceWith(block);
          }
          highlightNew(block);
          addCopyButtons(block);
          if (wasNearBottom) scrollToBottom();
        }
    </script>
</head>
<body>
<div id="wrap"></div>
</body>
</html>
